# Build the site and deploy it to GitHub Pages. The static files are served as
# they are; every page - the front page, the flasher, the blog - is assembled
# from the shared pieces in _partials/ by tools/build-site.py. The interactive
# demo is not built here at all: the console repository publishes it to
# demo.espkvm.io, and /demo/ is a committed redirect to that domain.
#
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependencies and no toolchain: every page is assembled from
      # _partials/ with the Python that is already on the runner.
      - name: Build the site
        run: python3 tools/build-site.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          # Ship what the step above rendered (index.html, flash/, blog/,
          # sitemap.xml) together with the files that are committed as they
          # are: CNAME, .nojekyll, robots/llms, the favicon, flash/flash.js,
          # demo/ (the redirect) and assets/. Repo docs and the page sources
          # are not site content.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='README.md' \
            --exclude='docs' \
            --exclude='_posts' \
            --exclude='_pages' \
            --exclude='_partials' \
            --exclude='_templates' \
            --exclude='tools' \
            --exclude='.gitignore' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
