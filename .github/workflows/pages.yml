# Build the site and deploy it to GitHub Pages. The static files are served as
# they are; the interactive demo at /demo/ is built from the espkvm/console
# submodule (its latest main, so the demo always matches the current console).
# Every other page - the front page, the flasher, the blog - is assembled from
# the shared pieces in _partials/ by tools/build-site.py.
#
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings -> Pages -> Build and deployment -> Source).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Build against the console's latest main rather than the pinned commit,
      # so the demo tracks the console without bumping a submodule pointer here.
      - name: Update console to latest main
        run: git submodule update --remote --init console

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build the demo
        working-directory: console
        run: |
          npm ci
          npm run build:demo

      # No dependencies and no toolchain: every page is assembled from
      # _partials/ with the Python that is already on the runner.
      - name: Build the site
        run: python3 tools/build-site.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          # Ship what the step above rendered (index.html, flash/, blog/,
          # sitemap.xml) together with the files that are committed as they
          # are: CNAME, .nojekyll, robots/llms, the favicon, flash/flash.js and
          # assets/. Repo docs and the page sources are not site content.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='console' \
            --exclude='_site' \
            --exclude='README.md' \
            --exclude='docs' \
            --exclude='_posts' \
            --exclude='_pages' \
            --exclude='_partials' \
            --exclude='_templates' \
            --exclude='tools' \
            --exclude='.gitmodules' \
            --exclude='.gitignore' \
            ./ _site/
          mkdir -p _site/demo
          cp console/dist/index.html _site/demo/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
