<script>
  /*
   * The menu on a narrow screen. The bar has room for five links on a desktop
   * and for none on a phone, where everything but Flash used to be simply
   * hidden - reachable only from the footer, which nobody scrolls to for
   * navigation.
   *
   * The panel is taken over here rather than in the markup: the button starts
   * hidden and the nav is marked [data-js] from this script, so a reader with
   * no JavaScript keeps the links in the bar, wrapped onto a second line.
   */
  (function () {
    var nav = document.querySelector(".nav"),
      btn = document.getElementById("nav-toggle"),
      menu = document.getElementById("nav-menu");
    if (!nav || !btn || !menu) return;
    nav.setAttribute("data-js", "");
    btn.hidden = false;

    function show(open) {
      btn.setAttribute("aria-expanded", String(open));
      if (open) {
        menu.setAttribute("data-open", "");
      } else {
        menu.removeAttribute("data-open");
      }
    }

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      show(btn.getAttribute("aria-expanded") !== "true");
    });
    /* Following a link, tapping the page, or Escape: all mean "done here". */
    menu.addEventListener("click", function (e) {
      if (e.target.closest("a")) show(false);
    });
    document.addEventListener("click", function (e) {
      if (!menu.contains(e.target) && !btn.contains(e.target)) show(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") show(false);
    });
  })();

  /* The star count on the GitHub link. It lives with the nav because the nav is
     on every page - it used to be filled by a script on the home page only, so
     everywhere else the number simply never appeared. Shares the home page's
     cache entry, so the two do not spend a visitor's API quota twice. */
  (function () {
    var ck = "espkvm:gh:repo",
      ttl = 30 * 60 * 1000,
      cached = null;
    var show = function (n) {
      var el = document.getElementById("gh-stars");
      if (el && typeof n === "number") {
        el.textContent = n;
        el.hidden = false;
      }
    };
    try {
      cached = JSON.parse(localStorage.getItem(ck) || "null");
    } catch (e) {}
    if (cached && cached.data) show(cached.data.stargazers_count);
    if (cached && Date.now() - cached.t < ttl) return;
    fetch("https://api.github.com/repos/espkvm/espkvm")
      .then(function (r) {
        return r.ok ? r.json() : Promise.reject();
      })
      .then(function (d) {
        try {
          localStorage.setItem(ck, JSON.stringify({ t: Date.now(), data: d }));
        } catch (e) {}
        show(d.stargazers_count);
      })
      .catch(function () {});
  })();
</script>
