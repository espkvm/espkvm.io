<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="t">
  <title id="t">The device holding several system images, offering one to a computer with an empty disk as a USB stick</title>
  <style>
    .ln{fill:none;stroke:#9aa7b4;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .bx{fill:#161b22;stroke:#9aa7b4;stroke-width:2;stroke-linejoin:round}
    .ac{fill:none;stroke:#4c9aff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .acb{fill:#12171e;stroke:#4c9aff;stroke-width:2;stroke-linejoin:round}
    .acf{fill:#4c9aff}
    .dot{fill:#9aa7b4}
    .t{fill:#9aa7b4;font-family:system-ui,sans-serif;font-size:13px}
    @media (prefers-color-scheme: light){
      .ln{stroke:#4c5764}
      .bx{fill:#ffffff;stroke:#4c5764}
      .ac{stroke:#1f6feb}
      .acb{fill:#ffffff;stroke:#1f6feb}
      .acf{fill:#1f6feb}
      .dot{fill:#4c5764}
      .t{fill:#4c5764}
    }
  </style>

